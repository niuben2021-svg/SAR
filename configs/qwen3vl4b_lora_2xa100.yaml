# Actual target confirmed by user: Kylin V10 x86, driver 595.58.03, 2x A100 40GB.
# Two GPUs x micro batch 1 x accumulation 8 = effective batch 16; not benchmarked.
# Official API reference: ms-swift Qwen3-VL Best Practice, checked 2026-10-21.
# Actual installed `swift sft --help` is still required by the validator.
model: Qwen/Qwen3-VL-4B-Instruct
nproc_per_node: 2
image_max_token_num: 1024
seed: 42
tuner_type: lora
torch_dtype: bfloat16
lora_rank: 16
lora_alpha: 32
target_modules: all-linear
freeze_vit: true
freeze_aligner: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_length: 2048
gradient_checkpointing: true
attn_impl: sdpa
num_train_epochs: 1
learning_rate: 0.0001
# DDP first. DeepSpeed/FlashAttention not prerequisites for this validation.
