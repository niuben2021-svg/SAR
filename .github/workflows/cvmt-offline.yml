name: Build verified CVMT CUDA118 offline image
on:
  push:
    branches: [delivery/cvmt-cu118-20261111]
    paths: ['docker-images/cvmt/**', '.github/workflows/cvmt-offline.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_IMAGE: cvmt-base:cu118
      TAG: cvmt-cu118-amd64-20261111
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disk and pinned source
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          mkdir -p release-assets
          git clone https://github.com/RSIP-NJUPT/CVMT.git docker-images/cvmt/CVMT
          git -C docker-images/cvmt/CVMT checkout a75079317972ecffb86a0b2cedfe7258d2dce2e1
          docker build --network host -f docker-images/cvmt/Base.Dockerfile -t "$BASE_IMAGE" docker-images/cvmt
      - name: Download all wheels and build offline derivative
        run: |
          set -o pipefail
          bash docker-images/cvmt/download_and_build.sh 2>&1 | tee release-assets/build.log
      - name: Verify network-disabled runtime
        run: |
          set -o pipefail
          docker run --rm --network none cvmt:cu118 python /opt/verify_cvmt.py 2>&1 | tee release-assets/verify.log
          docker run --rm --network none cvmt:cu118 python -m pip check | tee release-assets/pip-check.log
          docker run --rm --network none cvmt:cu118 python -m pip freeze > release-assets/requirements-actual.txt
          docker image inspect cvmt:cu118 > release-assets/image-inspect.json
      - name: Export complete image, source and verify reimport
        run: |
          set -euo pipefail
          git -C docker-images/cvmt/CVMT archive --format=tar.gz HEAD > release-assets/CVMT-source.tar.gz
          docker save cvmt:cu118 | gzip -1 | split -d --numeric-suffixes=1 -a 3 -b 1500000000 - release-assets/cvmt_cu118.tar.gz.part
          cd release-assets
          cat *.part* | gzip -t
          cat *.part* | sha256sum | sed 's/  -$/  cvmt_cu118.tar.gz/' > cvmt_cu118.tar.gz.sha256
          docker image rm cvmt:cu118
          docker builder prune -af
          cat *.part* | gzip -dc | docker load | tee reimport.log
          docker run --rm --network none cvmt:cu118 python /opt/verify_cvmt.py >> reimport.log 2>&1
          cp ../docker-images/cvmt/{load.sh,IMPORT.md,README_操作说明.md,run_container.sh} .
          tar -czf build-toolkit.tar.gz -C .. docker-images/cvmt/Dockerfile docker-images/cvmt/constraints.txt docker-images/cvmt/verify_cvmt.py docker-images/cvmt/download_and_build.sh docker-images/cvmt/offline_build.sh
          sha256sum ./* > ../cvmt-sums
          mv ../cvmt-sums SHA256SUMS
      - name: Publish complete image and instructions
        run: |
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CVMT CUDA11.8 x86_64 完整离线镜像与操作说明' --notes-file release-assets/IMPORT.md
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvmt-diagnostics
          path: release-assets/*.log
