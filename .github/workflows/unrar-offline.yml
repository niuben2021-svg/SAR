name: Verify and publish ARM64 unrar offline bundle
on:
  push:
    branches: [delivery/unrar-offline-20261029]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: unrar-arm64-bookworm-20261029
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Offline install and actual extraction in disposable Debian12 ARM64 container
        run: |
          mkdir -p release-assets
          docker pull --platform linux/arm64 python:3.11-slim-bookworm
          docker run --rm --network none --platform linux/arm64 -v "$PWD/offline-tools/unrar-arm64:/bundle:ro" python:3.11-slim-bookworm bash -c 'bash /bundle/install.sh && unrar t /bundle/test.rar && mkdir /tmp/unrar-smoke && unrar x -o- /bundle/test.rar /tmp/unrar-smoke/ && cmp /bundle/test.txt /tmp/unrar-smoke/test.txt' 2>&1 | tee release-assets/offline-install-test.log
      - name: Package original Debian binaries and installation instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('offline-tools/unrar-arm64')
          with ZipFile('release-assets/sar-unrar-bookworm-arm64-offline.zip','w',ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,Path('unrar-arm64')/p.relative_to(root))
          PY
          cp offline-tools/unrar-arm64/README.md release-assets/INSTALL.md
          cd release-assets
          sha256sum * > /tmp/unrar-checksums
          mv /tmp/unrar-checksums SHA256SUMS
      - name: Publish download
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ARM64 Debian 12 unrar offline installer' --notes-file release-assets/INSTALL.md release-assets/*
