name: Build YOLO11 OBB CUDA121 offline image
on:
  push:
    branches: [delivery/yolo11-obb-cu121-20261111]
    paths: ['docker-images/yolo11-obb/**', '.github/workflows/yolo11-obb-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yolo11-obb-cu121-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: sar-yolo11-obb:8.4.209-cu121
      BASE: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
      TAG: yolo11-obb-8.4.209-cu121-amd64-20261111
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disk on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          mkdir -p release-assets
          df -h /
      - name: Prepare fixed source and all five official OBB weights
        run: bash docker-images/yolo11-obb/scripts/01_online_prepare.sh
      - name: Build CUDA121 image
        run: |
          set -o pipefail
          docker pull --platform linux/amd64 "$BASE"
          docker build --platform linux/amd64 --pull=false -t "$IMAGE" docker-images/yolo11-obb 2>&1 | tee release-assets/build.log
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
      - name: Offline pretrained inference and synthetic training verification
        run: |
          set -o pipefail
          docker run --rm --network none "$IMAGE" python -m pip check | tee release-assets/pip-check.log
          docker run --rm --network none --shm-size=2g "$IMAGE" python /opt/sar-yolo/scripts/check_image.py --train-smoke 2>&1 | tee release-assets/offline-tests.log
      - name: Export full image and verify reimport
        run: bash docker-images/yolo11-obb/scripts/export.sh
      - name: Publish all image parts and import tools
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title 'YOLO11 OBB 8.4.209 CUDA12.1 x86_64 完整离线镜像' --notes-file release-assets/IMPORT.md
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo11-obb-diagnostics
          path: |
            release-assets/*.log
            release-assets/*.json
            release-assets/*.txt
          if-no-files-found: ignore
