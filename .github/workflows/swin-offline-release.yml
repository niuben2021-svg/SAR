name: Build Swin-T ARM64 A100 offline image
on:
  push:
    branches: [delivery/swin-arm64-image-20261106]
    paths: ['.github/workflows/swin-offline-release.yml', 'scripts/release/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: swin-arm64-offline-release
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: sar-swin-p1:arm64-cu126
      RELEASE_TAG: sar-swint-arm64-a100-cu126-20261106
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare disk on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
          docker info
      - name: Build, validate, and export complete image
        run: bash scripts/release/build-swin.sh
      - name: Publish complete offline image
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title 'SAR Swin-T ARM64 A100 CUDA 12.6 完整离线镜像' --notes-file release-assets/IMPORT.md
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swin-arm64-build-diagnostics
          path: |
            release-assets/*.log
            release-assets/*.json
            release-assets/*.txt
          if-no-files-found: ignore
